# 📡 CONFIGURATION GAMMU - SERVEUR SMS MOSSOMBI

[gammu]
device = /dev/ttyUSB0
connection = at
logfile = /var/log/gammu.log
logformat = textalldate

[smsd]
service = files
logfile = /var/log/smsd.log
debuglevel = 1

# Répertoires de traitement
inboxpath = /var/spool/gammu/inbox/
outboxpath = /var/spool/gammu/outbox/
sentsmspath = /var/spool/gammu/sent/
errorsmspath = /var/spool/gammu/error/

# Configuration SMS
deliveryreport = no
multiparttimeout = 30
commtimeout = 30
sendtimeout = 30

# Sécurité
maxretries = 3
runonreceive = /app/scripts/on_receive.sh
