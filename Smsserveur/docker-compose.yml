# 🐳 DOCKER COMPOSE - SERVEUR SMS MOSSOMBI
version: '3.8'

services:
  sms-server:
    build: .
    container_name: mossombi-sms-server
    restart: unless-stopped
    
    # Variables d'environnement
    environment:
      - PORT=8080
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_KEY=mossombi_sms_secret_key_2024
      - MODEM_DEVICE=/dev/ttyUSB0
      - MODEM_CONNECTION=at
      - MAX_CONCURRENT_SMS=5
      - RETRY_ATTEMPTS=3
      - RETRY_DELAY=30
    
    # Ports
    ports:
      - "8080:8080"
    
    # Volumes
    volumes:
      - ./logs:/var/log
      - ./data:/var/spool/gammu
      - /dev:/dev  # Accès aux périphériques USB
    
    # Privilèges pour accès USB
    privileged: true
    
    # Devices USB (modem GSM)
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    
    # Santé du conteneur
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Réseau
    networks:
      - mossombi-network

# Réseau partagé avec Backend Mossombi
networks:
  mossombi-network:
    external: true
